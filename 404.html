<!doctype html>
<html lang="zh-Hant" data-lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#000000">
  <title>404 · Lost Signal — MAKOTO LAB</title>
  <link rel="stylesheet" href="/assets/404-game.css?v=11">
  <script src="/assets/404-game.js?v=11" defer></script>
</head>
<body data-phase="error">
  <main>
    <section id="error" class="intro" aria-labelledby="error-title">
      <h1 id="error-title">404</h1>
      <a href="/" class="intro-home" data-zh="返回首頁" data-en="Return home">返回首頁</a>
    </section>
    <div id="static" aria-hidden="true" hidden><canvas id="noise" width="192" height="108"></canvas></div>
    <div id="question" class="intro" hidden>
      <div class="prompt">
        <p id="prompt-title" tabindex="-1" data-zh="你在找什麼嗎？" data-en="Are you looking for something?">你在找什麼嗎？</p>
        <div id="answers" class="choices" hidden>
          <button id="yes" type="button" data-zh="是" data-en="Yes">是</button>
          <button id="unsure" type="button" data-zh="不知道" data-en="I don't know">不知道</button>
        </div>
        <nav id="destinations" class="choices" aria-label="網站頁面" hidden>
          <a href="/" data-zh="首頁" data-en="Home">首頁</a>
          <a href="/makoto-lab/#projects" data-zh="專案" data-en="Projects">專案</a>
          <a href="/blog/" data-zh="文章" data-en="Notes">文章</a>
          <button id="back" type="button" data-zh="返回" data-en="Back">返回</button>
        </nav>
      </div>
    </div>
    <div id="act-card" class="intro act-card" aria-live="polite" hidden>
      <div class="act-card-inner">
        <p id="act-eyebrow" class="act-eyebrow"></p>
        <h2 id="act-title" class="act-title"></h2>
        <p id="act-sub" class="act-sub"></p>
      </div>
    </div>
    <section id="adventure" aria-labelledby="location" hidden>
      <header>
        <div class="brand-group">
          <a href="/" class="brand-link">MAKOTO LAB</a>
          <span class="brand-divider" aria-hidden="true">/</span>
          <span class="brand-sub" data-zh="404 · 失落訊號" data-en="404 · LOST SIGNAL">404 · 失落訊號</span>
        </div>
        <div class="header-actions">
          <button id="sound" type="button" aria-pressed="true" data-zh="聲音 · 開" data-en="SOUND · ON">聲音 · 開</button>
          <button id="language" type="button">EN</button>
          <a href="/" class="header-home" data-zh="返回首頁 ↗" data-en="Return home ↗">返回首頁 ↗</a>
        </div>
      </header>
      <div class="game">
        <div class="scene-shell">
          <div class="scene-hud">
            <span id="chapter-hud">ACT I · STILL PLATFORM</span>
            <span id="status-hud">POWER · OFFLINE</span>
          </div>
          <div class="scene">
            <canvas id="view" width="640" height="360" role="img"></canvas>
            <div id="scene-caption" class="scene-caption" hidden></div>
            <div class="eyelid top" aria-hidden="true"></div>
            <div class="eyelid bottom" aria-hidden="true"></div>
          </div>
        </div>
        <div class="story">
          <aside class="location">
            <div class="location-head">
              <p id="room-code" class="eyebrow">01 / PLATFORM</p>
              <h2 id="location" tabindex="-1"></h2>
            </div>
            <div class="sidebar-section">
              <p id="inventory" class="sidebar-label"></p>
              <div id="inventory-items" class="inventory-items" role="list"></div>
            </div>
            <div class="sidebar-section">
              <div class="progress-head">
                <span data-zh="探索進度" data-en="PROGRESS">探索進度</span>
                <span id="progress-text">0%</span>
              </div>
              <div class="progress-track" aria-hidden="true">
                <div id="progress-fill" class="progress-fill"></div>
              </div>
            </div>
          </aside>
          <div class="main-column">
            <div class="narrative" aria-live="polite">
              <div id="epilogue-banner" class="epilogue-banner" hidden>
                <p id="epilogue-eyebrow" class="epilogue-eyebrow"></p>
                <h3 id="epilogue-title" class="epilogue-title"></h3>
              </div>
              <p id="description"></p>
              <p id="feedback" tabindex="-1"></p>
              <div id="sequence"></div>
              <details id="notebook" hidden>
                <summary>
                  <span class="notebook-title" data-zh="線索筆記" data-en="Clue notebook">線索筆記</span>
                  <span id="note-count" class="note-count"></span>
                </summary>
                <ul id="notes"></ul>
              </details>
            </div>
            <div id="choices" class="choices"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
