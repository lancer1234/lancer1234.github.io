<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Makoto Glass iPhone bridge</title>
  <desc id="desc">Diagram showing iPhone Bluetooth services ANCS and AMS connecting directly to Google Glass Enterprise Edition 2 running Makoto Glass.</desc>
  <rect width="1400" height="720" fill="#f5f5f2"/>
  <text x="72" y="86" fill="#0b0b0b" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4">MAKOTO GLASS / CORE IDEA</text>
  <rect x="90" y="190" width="360" height="330" fill="#fff" stroke="#0b0b0b" stroke-width="2"/>
  <rect x="950" y="190" width="360" height="330" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/>
  <text x="140" y="275" fill="#0b0b0b" font-family="Georgia, 'Times New Roman', serif" font-size="70">iPhone</text>
  <text x="140" y="330" fill="#555" font-family="Arial, Helvetica, sans-serif" font-size="18">APPLE BLUETOOTH SERVICES</text>
  <text x="140" y="400" fill="#0b0b0b" font-family="Arial, Helvetica, sans-serif" font-size="26">ANCS  /  Notifications</text>
  <text x="140" y="446" fill="#0b0b0b" font-family="Arial, Helvetica, sans-serif" font-size="26">AMS   /  Media</text>
  <text x="995" y="275" fill="#f5f5f2" font-family="Georgia, 'Times New Roman', serif" font-size="62">Glass EE2</text>
  <text x="995" y="330" fill="#aaa" font-family="Arial, Helvetica, sans-serif" font-size="18">ANDROID 8.1 / MAKOTO GLASS</text>
  <text x="995" y="400" fill="#f5f5f2" font-family="Arial, Helvetica, sans-serif" font-size="25">Notifications</text>
  <text x="995" y="446" fill="#f5f5f2" font-family="Arial, Helvetica, sans-serif" font-size="25">Now Playing + Controls</text>
  <line x1="450" y1="355" x2="950" y2="355" stroke="#0b0b0b" stroke-width="3"/>
  <polygon points="940,343 965,355 940,367" fill="#0b0b0b"/>
  <text x="595" y="320" fill="#0b0b0b" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="2">BLUETOOTH LE</text>
  <text x="545" y="410" fill="#666" font-family="Arial, Helvetica, sans-serif" font-size="17">NO ROOT · NO JAILBREAK</text>
  <text x="518" y="442" fill="#666" font-family="Arial, Helvetica, sans-serif" font-size="17">CORE FEATURES NEED NO PHONE APP</text>
  <text x="72" y="650" fill="#777" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2">MAKOTO LAB / ORIGINAL GRAPHIC · 2026</text>
</svg>