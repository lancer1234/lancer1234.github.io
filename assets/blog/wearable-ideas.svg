<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Ideas Google Glass introduced that later appeared across wearables</title>
  <desc id="desc">An original diagram connecting glanceable information, voice assistance, first-person capture and phone companionship from Google Glass to later wearable categories.</desc>
  <rect width="1400" height="760" fill="#0b0b0b"/>
  <text x="72" y="84" fill="#f5f5f2" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4">THE IDEA DID NOT DISAPPEAR</text>
  <text x="72" y="186" fill="#f5f5f2" font-family="Georgia, 'Times New Roman', serif" font-size="72">Glass split into an ecosystem.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="72" y="280" width="280" height="270" fill="#151515" stroke="#555"/>
    <text x="100" y="335" fill="#aaa" font-size="15" letter-spacing="2">GLANCEABLE INFO</text>
    <text x="100" y="410" fill="#f5f5f2" font-size="34">Smartwatches</text>
    <text x="100" y="455" fill="#8f8f8b" font-size="18">notifications · directions</text>
    <rect x="385" y="280" width="280" height="270" fill="#151515" stroke="#555"/>
    <text x="413" y="335" fill="#aaa" font-size="15" letter-spacing="2">VOICE + AUDIO</text>
    <text x="413" y="410" fill="#f5f5f2" font-size="34">Earbuds</text>
    <text x="413" y="455" fill="#8f8f8b" font-size="18">assistant · calls · media</text>
    <rect x="698" y="280" width="280" height="270" fill="#151515" stroke="#555"/>
    <text x="726" y="335" fill="#aaa" font-size="15" letter-spacing="2">FIRST-PERSON CAPTURE</text>
    <text x="726" y="410" fill="#f5f5f2" font-size="34">AI Glasses</text>
    <text x="726" y="455" fill="#8f8f8b" font-size="18">camera · context · AI</text>
    <rect x="1011" y="280" width="317" height="270" fill="#f5f5f2"/>
    <text x="1040" y="335" fill="#666" font-size="15" letter-spacing="2">DISPLAY + PHONE</text>
    <text x="1040" y="410" fill="#0b0b0b" font-size="34">Android XR</text>
    <text x="1040" y="455" fill="#555" font-size="18">in-lens info · Gemini</text>
  </g>
  <text x="72" y="674" fill="#777" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2">MAKOTO LAB / ORIGINAL GRAPHIC · 2026</text>
</svg>