<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
  <title id="title">MightyScroll / precise, fast, fluid</title>
  <desc id="desc">Conceptual illustration: slow input remains precise, repeated fast rolls accelerate, then momentum decays. Both vertical and horizontal scrolling are supported. Not measured data.</desc>
  <rect width="1400" height="640" fill="#0b0b0b"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f5f5f2">
    <text x="76" y="92" font-size="24" letter-spacing="4">MIGHTYSCROLL / FEEL</text>
    <text x="90" y="190" font-size="25">01 / PRECISE</text>
    <text x="525" y="190" font-size="25">02 / ACCELERATE</text>
    <text x="960" y="190" font-size="25">03 / MOMENTUM</text>
  </g>
  <g stroke="#555" stroke-width="2"><path d="M90 390H440 M525 390H875 M960 390H1310"/></g>
  <g stroke="#f5f5f2" stroke-width="4" fill="none">
    <path d="M110 390v-35h55v-35h55v-35h55v-35h55v-35h55"/>
    <path d="M545 390 Q665 360 705 295 T855 215"/>
    <path d="M980 215 C1060 215 1060 375 1290 385"/>
  </g>
  <g fill="#9b9b97" font-family="Arial, Helvetica, sans-serif" font-size="21">
    <text x="90" y="455">SLOW ROLLS / SMALL STEPS</text>
    <text x="525" y="455">FAST REPEATED ROLLS</text>
    <text x="960" y="455">INPUT STOPS / GENTLE DECAY</text>
  </g>
  <text x="76" y="570" fill="#777" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2">MAKOTO LAB / ORIGINAL GRAPHIC · 2026 · CONCEPT ONLY · VERTICAL + HORIZONTAL</text>
</svg>
