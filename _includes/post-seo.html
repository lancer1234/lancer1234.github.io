{% assign canonical_url = page.url | prepend: site.url %}
{% assign article_image = page.image | prepend: site.url %}
<link rel="canonical" href="{{ canonical_url | escape }}" />
<meta property="og:type" content="article" />
<meta property="og:site_name" content="MAKOTO LAB" />
<meta property="og:locale" content="zh_TW" />
<meta property="og:locale:alternate" content="en_US" />
<meta property="og:url" content="{{ canonical_url | escape }}" />
<meta property="og:title" content="{{ page.seo_title_zh | default: page.title_zh | escape }}" />
<meta property="og:description" content="{{ page.seo_description_zh | default: page.description_zh | escape }}" />
<meta property="og:image" content="{{ article_image | escape }}" />
<meta property="og:image:width" content="720" />
<meta property="og:image:height" content="900" />
<meta property="og:image:alt" content="{{ page.image_alt | escape }}" />
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
<meta property="article:modified_time" content="{{ page.date_modified | default: page.date | date_to_xmlschema }}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ page.seo_title_zh | default: page.title_zh | escape }}" />
<meta name="twitter:description" content="{{ page.seo_description_zh | default: page.description_zh | escape }}" />
<meta name="twitter:image" content="{{ article_image | escape }}" />
<meta name="twitter:image:alt" content="{{ page.image_alt | escape }}" />
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "@id": {{ canonical_url | append: '#article' | jsonify }},
  "mainEntityOfPage": {"@type": "WebPage", "@id": {{ canonical_url | jsonify }}},
  "url": {{ canonical_url | jsonify }},
  "headline": {{ page.title_zh | jsonify }},
  "alternativeHeadline": {{ page.title_en | jsonify }},
  "description": {{ page.seo_description_zh | default: page.description_zh | jsonify }},
  "abstract": [
    {"@value": {{ page.seo_description_zh | jsonify }}, "@language": "zh-Hant"},
    {"@value": {{ page.seo_description_en | jsonify }}, "@language": "en"}
  ],
  "inLanguage": ["zh-Hant", "en"],
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
  "dateModified": {{ page.date_modified | default: page.date | date_to_xmlschema | jsonify }},
  "author": {"@type": "Person", "name": {{ page.author_name | jsonify }}},
  "publisher": {"@type": "Organization", "name": "MAKOTO LAB", "url": {{ site.url | append: '/' | jsonify }}},
  "image": {"@type": "ImageObject", "url": {{ article_image | jsonify }}, "width": 720, "height": 900, "caption": {{ page.image_alt | jsonify }}},
  "articleSection": "MAKOTO LAB",
  "about": {"@type": "SoftwareApplication", "name": "AirPulse", "operatingSystem": "Android, Android TV", "url": "https://github.com/lancer1234/AirPulse"},
  "citation": [
    "https://github.com/lancer1234/AirPulse/tree/6efa15d69f8bdd2b818a16c9cad064a0e63d1260",
    "https://developer.android.com/media/platform/av-capture",
    "https://developer.apple.com/documentation/avfoundation/avplayer/sourceclock"
  ]
}
</script>
